        <input type="range" id="zoom" min="-10" max="10" value="1" step="0.5">
        <span id="zoomValue"></span>
    </div>
    <div id="inputPane">
        <label for="equation">Input: </label>
        <input type="text" id="equation" placeholder='ex. "+2x^3 +x^2 -3"' autocomplete="off">

    <div id="displayEqn">
        <span>Plotted: </span>
        <span id="eqn"></span>
